name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src data inference tests

      - name: Run data-pipeline and inference-wrapper tests
        run: pytest tests/ -v

  # GPU-dependent training/eval scripts (train_dapt.py, train_sft.py,
  # benchmark.py) are intentionally NOT run in CI — GitHub-hosted runners
  # have no GPU and these need real model weights + real data. CI's job
  # here is to catch pipeline/logic regressions before they cost Colab
  # GPU time, not to run training end-to-end.

  docker-build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FastAPI app imports cleanly
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic
          python -c "import ast; ast.parse(open('inference/app_fastapi.py').read())"
