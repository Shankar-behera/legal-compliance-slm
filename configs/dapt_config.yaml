base_model: "Qwen/Qwen2.5-1.5B-Instruct"
output_dir: "/content/drive/MyDrive/legal-compliance-slm/checkpoints/dapt"

data:
  processed_path: "data/processed/dapt_chunks.jsonl"
  block_size: 512
  text_column: "text"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 200
  save_total_limit: 3
  fp16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  report_to: "wandb"
  run_name: "legal-slm-dapt"

seed: 42
