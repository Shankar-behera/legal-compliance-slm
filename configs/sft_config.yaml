base_model_path: "/content/drive/MyDrive/legal-compliance-slm/checkpoints/dapt/final"
output_dir: "/content/drive/MyDrive/legal-compliance-slm/checkpoints/sft"

data:
  processed_path: "data/processed/sft_pairs.jsonl"
  max_seq_length: 1024
  prompt_column: "prompt"
  response_column: "response"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

lora_config: "configs/lora_config.yaml"

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  fp16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  report_to: "wandb"
  run_name: "legal-slm-sft-qlora"

eval:
  eval_split_ratio: 0.1
  eval_steps: 50

seed: 42
